services:
  api:
    build: .
    image: akim-api
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # The container always listens on 8080; change HOST_PORT to remap.
      ADDR: ":8080"
      AUTOPILOT_BUDGET_FILE: /state/usage.json
    volumes:
      - autopilot-state:/state
    restart: unless-stopped

volumes:
  autopilot-state:
